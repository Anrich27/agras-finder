 ['Remote controller','Transmission range',['7 km (FCC), 5 km (SRRC), 4 km (MIC/CE)','Relay: 8 km (FCC), 5 km (SRRC), 4 km (MIC/KCC/CE)','Relay: 8 km (FCC), 5 km (SRRC), 4 km (MIC/KCC/CE)']],
 ['Remote controller','Charging',['About 2 hours, USB-C up to 65 W','2 hours, USB-C up to 65 W','2 hours, USB-C up to 65 W']],

/* drop empty helper rows */
D.forEach(t=>{t.rows=t.rows.filter(r=>r.length===3&&(typeof r[2]==='string'?r[2]!=='':r[2].some(x=>x)))});

/* ================= SEARCH ================= */
const STOP=new Set('the of a an what whats is are how much many does do on for with and vs versus to in it its this that me tell give van die wat hoe is en op vir met se n by watter'.split(' '));
const SYN={
 horsepower:['power'],hp:['power','hp'],kw:['power','kw'],pk:['power'],krag:['power'],perdekrag:['power'],engine:['engine','power'],
 diesel:['fuel','diesel'],brandstof:['fuel'],tenk:['tank'],
 nm:['torque'],draaimoment:['torque'],wringkrag:['torque'],
 gearbox:['transmission','gearbox'],gears:['transmission','speeds'],ratkas:['transmission'],powershift:['powershift','transmission'],cvt:['cvxdrive','cvt'],
 tire:['tyre'],tires:['tyre'],tyres:['tyre'],tyre:['tyre'],band:['tyre'],bande:['tyre'],wheels:['tyre','wheel'],
 mass:['weight'],gewig:['weight'],swaar:['weight'],weeg:['weight'],heavy:['weight'],weigh:['weight'],ballast:['ballasted','weight'],

 hef:['lift'],hefvermoe:['lift'],lifting:['lift'],linkage:['linkage','lift','hitch'],'3pt':['linkage','hitch','lift'],hitch:['hitch','lift'],
 spools:['remote'],spool:['remote'],scv:['remote'],remotes:['remote'],valves:['valve','remote'],kleppe:['valve','remote'],

 adblue:['urea','emission'],def:['urea'],emissions:['emission','tier','stage'],emission:['emission','tier','stage'],
 table:['header'],platform:['header'],cutterbar:['header'],tafel:['header'],snybord:['header'],
 offload:['unloading'],uitlaai:['unloading'],
 breedte:['width'],wydte:['width'],wide:['width'],lengte:['length'],long:['length'],hoogte:['height'],tall:['height'],

 litre:['displacement','engine'],liter:['displacement','engine'],cc:['displacement','cc'],size:['displacement','size'],
 tracks:['track'],spore:['track'],
 spray:['spray','boom','nozzle'],spuit:['spray','boom','sprayer'],nozzles:['nozzle'],nossels:['nozzle'],
 grondvryhoogte:['clearance'],cabin:['cab'],kajuit:['cab'],battery:['battery','alternator'],
 trekker:['tractor'],stroper:['combine'],sprayers:['sprayer'],combines:['combine'],
 warranty:['warranty'],waarborg:['warranty'],gps:['guidance','accuguide'],autosteer:['guidance','accuguide'],steering:['steering','steer']
};
const norm=s=>String(s).toLowerCase().replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[’'"]/g,'').replace(/ë/g,'e').replace(/ê/g,'e').replace(/ô/g,'o');
const words=s=>norm(s).match(/[a-z0-9]+(?:\.[0-9]+)?/g)||[];
const isNum=w=>/^\d/.test(w);
function tokens(q){
  let t=words(q).filter(w=>w.length>1||isNum(w));
  const kept=t.filter(w=>!STOP.has(w));
  return kept.length?kept:t;
}
function hits(alt,ws){
  const a=alt.p;
  for(const w of ws){
    if(isNum(a)?w===a:(a.length<3?w===a:w.startsWith(a)))return true;
    for(const x of alt.x)if(w===x||w===x+'s')return true;
  }
  return false;
}
/* prepare word lists */
D.forEach(t=>{
  t.rangeWords=words(t.name+' '+t.kw+' '+RANGES.find(r=>r.id===t.r).n);
  t.mWords=t.models.map(m=>words(m[0]+' '+m[1]));
  t.rows.forEach(r=>{
    r.lw=words(r[1]);r.sw=words(r[0]);
    r.vw=t.models.map((m,i)=>words(typeof r[2]==='string'?r[2]:r[2][i]||''));
  });
});
const valOf=(r,i)=>typeof r[2]==='string'?r[2]:(r[2][i]||'');

function known(t){
  const alt={p:t,x:SYN[t]||[]};
  return D.some(d=>hits(alt,d.rangeWords)||d.mWords.some(w=>hits(alt,w))||d.rows.some(r=>hits(alt,r.lw)||hits(alt,r.sw)||r.vw.some(w=>hits(alt,w))));
}
function search(q,range){
  const all=tokens(q);if(!all.length)return null;
  const res=searchT(all,range);
  if((res.cards&&res.cards.length)||res.sheets||res.picker)return res;
  const tk=all.filter(known),skipped=all.filter(t=>!known(t));
  if(!tk.length||!skipped.length)return res;
  const r2=searchT(tk,range);r2.skipped=skipped;return r2;
}
function searchT(tk,range){
  const alts=tk.map(t=>({p:t,x:SYN[t]||[]}));
  const tables=D.filter(t=>range==='all'||t.r===range);
  const sheets=[],cards=[];
  for(const t of tables){
    // which tokens each model covers by name / range
    const mh=t.models.map((m,i)=>alts.map(a=>hits(a,t.mWords[i])||hits(a,t.rangeWords)));
    const named=t.models.map((m,i)=>alts.some((a,k)=>hits(a,t.mWords[i])&&!hits(a,t.rangeWords)));
    // model-only query → sheet
    t.models.forEach((m,i)=>{if(mh[i].every(Boolean)&&(named[i]||tk.length===alts.filter((a,k)=>hits(a,t.rangeWords)).length))sheets.push({t,i,named:named[i]})});
    t.rows.forEach((r,ri)=>{
      const lh=alts.map(a=>hits(a,r.lw)),sh=alts.map(a=>hits(a,r.sw));
      const anyRow=lh.some(Boolean)||sh.some(Boolean);
      const ms=[];let best=0;
      t.models.forEach((m,i)=>{
        if(!valOf(r,i))return;
        let sc=0,ok=true,rowTok=false;
        alts.forEach((a,k)=>{
          if(lh[k]){sc+=4;rowTok=true}else if(sh[k]){sc+=2;rowTok=true}
          else if(mh[i][k]){sc+=3}
          else if(hits(a,r.vw[i])){sc+=1;rowTok=true}
          else ok=false;
        });

      });
      if(ms.length){
        const anyNamed=ms.some(i=>named[i]);
        const focus=anyNamed?ms.filter(i=>named[i]):ms;
        const lead=r.lw.length?2*lh.filter(Boolean).length/r.lw.length:0;
        cards.push({t,r,ri,focus,score:best+lead+(anyNamed?2:0)+(anyRow?1:0)});
      }
    });
  }
  // when the query only names models, show their sheets instead of every row that mentions them
  const namedSheets=sheets.filter(s=>s.named);
  if(namedSheets.length&&!cards.some(c=>c.r.lw.length&&alts.some(a=>hits(a,c.r.lw)||hits(a,c.r.sw)))){
    return {sheets:namedSheets,cards:[]};
  }
  if(sheets.length&&!cards.length)return {picker:sheets};
  cards.sort((a,b)=>b.score-a.score||D.indexOf(a.t)-D.indexOf(b.t)||a.ri-b.ri);
  return {cards:cards.slice(0,40),total:cards.length};
}

/* ================= UI ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const St={q:'',range:'all',sheet:null};
const KEY='agras-spec-finder.v1';
function loadPrefs(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function savePrefs(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
let prefs=loadPrefs();if(!Array.isArray(prefs.recent))prefs.recent=[];

const QUICK=['Spray tank','Spray width','Flow rate','Spreading tank','Takeoff weight','Battery','Charge time','Generator','Remote controller','Obstacle avoidance','Lifting','Wheelbase'];
const short=n=>n.replace(/^Agras /,'');
function isLong(v){return v.length>28}

function cardHTML(c){
  const {t,r,focus}=c,all=t.models.map((m,i)=>i).filter(i=>valOf(r,i));
  const single=typeof r[2]==='string';
  let body='';
  if(single){
    body=`<div class="ans"><div class="ans-row"><span class="m">${esc(focus.length===t.models.length||focus.length>2?'All models':focus.map(i=>t.models[i][0]).join(', '))}</span><span class="v${isLong(r[2])?' long':''}">${esc(r[2])}</span></div></div>`;
  }else{
    body=`<div class="ans">${focus.map(i=>`<div class="ans-row"><span class="m">${esc(t.models[i][0])}</span><span class="v${isLong(valOf(r,i))?' long':''}">${esc(valOf(r,i))}</span></div>`).join('')}</div>`;
    const rest=all.filter(i=>!focus.includes(i));
    if(rest.length)body+=`<div class="others">${rest.map(i=>`<span>${esc(short(t.models[i][0]))}: <b>${esc(valOf(r,i))}</b></span>`).join('')}</div>`;
  }
  return `<article class="card"><div class="card-h"><span class="eyebrow">${esc(t.name)} · ${esc(r[0])}</span></div><h2>${esc(r[1])}</h2>${body}<div class="src">Source: ${esc(t.src)}</div></article>`;
}
function sheetHTML(t,i,hl){
  const secs=[];t.rows.forEach(r=>{const v=valOf(r,i);if(!v)return;let s=secs.find(x=>x.n===r[0]);if(!s)secs.push(s={n:r[0],rows:[]});s.rows.push([r[1],v])});
  return `<article class="card"><div class="band"><h2>${esc(t.models[i][0])}</h2><span>${esc(t.name)}</span></div>
   ${secs.map(s=>`<div class="sec">${esc(s.n)}</div>${s.rows.map(x=>`<div class="kv"><span class="k">${esc(x[0])}</span><span class="v">${esc(x[1])}</span></div>`).join('')}`).join('')}
   <div class="src" style="padding-top:10px">Source: ${esc(t.src)}</div></article>`;
}
function browseHTML(){
  const recent=prefs.recent.length?`<div class="label">Recent</div><div class="chips">${prefs.recent.map(r=>`<button class="chip" data-q="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:'';
  const tabs=D.filter(t=>St.range==='all'||t.r===St.range);
  return `${recent}<div class="label">Quick look-ups</div><div class="chips">${QUICK.map(q=>`<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
   <div class="label">Browse models</div>
   ${tabs.map(t=>`<section class="card"><div class="band"><h2>${esc(t.name)}</h2><span>${t.models.length} models</span></div><div class="mlist">${t.models.map(m=>`<button class="mbtn" data-q="${esc(m[0])}">${esc(m[0])}<small>${esc(({'Agras T50':'40 l tank · 4–11 m swath','Agras T70P':'70 l tank · 4–11 m swath','Agras T100':'100 l tank · 5–13 m swath'})[m[0]]||'')}</small></button>`).join('')}</div></section>`).join('')}
   <div class="foot"><p>Everything on this page is stored inside it, so search keeps working with no signal once the page is open.</p><p>Figures come from DJI Agriculture's official spec pages. Flight times are dealer estimates; DJI does not publish them. Where local stock or a South African DJI sheet differs, the local figure wins.</p></div>`;
}
function render(){
  const out=$('out');$('clear').hidden=!St.q;
  if(!St.q.trim()){out.innerHTML=browseHTML();return}
  const res=search(St.q,St.range);
  if(!res){out.innerHTML=browseHTML();return}
  const skip=res.skipped?`<p class="status">No match for “${esc(res.skipped.join(' '))}”, so it was left out.</p>`:'';
  if(res.sheets){out.innerHTML=skip+res.sheets.slice(0,3).map(s=>sheetHTML(s.t,s.i)).join('')+(res.sheets.length>3?`<p class="status">${res.sheets.length-3} more models match. Add the model number to narrow it down.</p>`:'');return}
  if(res.picker){out.innerHTML=`<p class="status">Pick a model, or add a spec such as “lift” or “fuel”.</p><section class="card"><div class="mlist">${res.picker.map(s=>`<button class="mbtn" data-q="${esc(s.t.models[s.i][0])}">${esc(s.t.models[s.i][0])}<small>${esc(s.t.name)}</small></button>`).join('')}</div></section>`;return}
  if(!res.cards.length){out.innerHTML=`<div class="empty"><strong>Nothing found for “${esc(St.q)}”.</strong><span class="status">Try a model and a spec, such as “magnum 340 lift”, “puma fuel” or “8260 grain tank”. You can also tap a model under Browse.</span><button class="back" data-q="">Back to browse</button></div>`;return}
  out.innerHTML=skip+`<p class="status">${res.total} answer${res.total===1?'':'s'}${res.total>40?', showing the best 40':''}</p>`+res.cards.map(cardHTML).join('');
}
let tRecent=null;
function setQ(q,push){
  St.q=q;$('q').value=q;render();
  clearTimeout(tRecent);
  if(q.trim())tRecent=setTimeout(()=>{const v=q.trim();prefs.recent=[v,...prefs.recent.filter(x=>x.toLowerCase()!==v.toLowerCase())].slice(0,6);savePrefs(prefs)},1500);
  if(push)try{window.scrollTo({top:0})}catch(e){}
}
function boot(){
  if(RANGES.length<2)$('ranges').hidden=true;
  $('ranges').innerHTML=[{id:'all',n:'All'},...RANGES].map(r=>`<button class="rchip" data-r="${r.id}" aria-pressed="${St.range===r.id}">${esc(r.n)}</button>`).join('');
  $('ranges').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;St.range=b.dataset.r;document.querySelectorAll('.rchip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.r===St.range)));render()});
  $('q').addEventListener('input',e=>setQ(e.target.value));
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur()}});
  $('clear').addEventListener('click',()=>{setQ('');$('q').focus()});
  $('out').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;setQ(b.dataset.q,true)});
  render();
}
if(typeof globalThis!=='undefined')globalThis.__finder={D,search};
if(typeof document!=='undefined')boot();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
